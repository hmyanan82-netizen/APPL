<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة إدارة الطلبات</title>
<style>
  :root{--bg:#f8f9fa;--ink:#141414;--muted:#8a8f98;--line:#e3e3e3;--accent:#e02424;--green:#1a9c45;--orange:#e68a00}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
  body{max-width:900px;margin:0 auto;min-height:100vh;padding:16px}

  header{background:#fff;border-radius:16px;padding:20px 24px;margin-bottom:20px;
    box-shadow:0 2px 12px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:22px;font-weight:800}
  .stats{display:flex;gap:12px}
  .stat{background:var(--bg);padding:8px 16px;border-radius:10px;text-align:center}
  .stat .num{font-size:20px;font-weight:800;color:var(--accent)}
  .stat .lbl{font-size:11px;color:var(--muted)}
  .refresh-btn{border:1.5px solid var(--line);background:#fff;padding:10px 18px;
    border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .refresh-btn:hover{background:#f3f4f6}

  .orders-list{display:flex;flex-direction:column;gap:12px}
  .order-card{background:#fff;border-radius:16px;padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);border:1px solid var(--line)}
  .order-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .order-id{font-size:13px;color:var(--muted)}
  .badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
  .badge.pending{background:#fff3e0;color:var(--orange)}
  .badge.confirmed{background:#e8f5e9;color:var(--green)}
  .badge.cancelled{background:#ffeaea;color:var(--accent)}
  .order-info{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .order-info .item{font-size:14px}
  .order-info .item .lbl{font-size:12px;color:var(--muted);margin-bottom:2px}
  .order-info .item .val{font-weight:600}
  .order-actions{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .order-actions button{flex:1;border:none;padding:10px;border-radius:10px;font-size:13px;
    font-weight:700;cursor:pointer;font-family:inherit}
  .btn-confirm{background:#e8f5e9;color:var(--green)}
  .btn-confirm:hover{background:#c8e6c9}
  .btn-cancel{background:#ffeaea;color:var(--accent)}
  .btn-cancel:hover{background:#ffcdd2}
  .btn-delete{background:#f5f5f5;color:var(--muted)}
  .btn-delete:hover{background:#e0e0e0}
  .empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:16px}

  @media(max-width:600px){
    .order-info{grid-template-columns:1fr}
    .stats{flex-wrap:wrap}
    header{flex-direction:column;gap:12px;text-align:center}
  }
</style>
</head>
<body>

<header>
  <h1>لوحة إدارة الطلبات</h1>
  <div class="stats">
    <div class="stat"><div class="num" id="totalCount">0</div><div class="lbl">إجمالي</div></div>
    <div class="stat"><div class="num" id="pendingCount">0</div><div class="lbl">قيد الانتظار</div></div>
    <div class="stat"><div class="num" id="confirmedCount">0</div><div class="lbl">مؤكد</div></div>
  </div>
  <button class="refresh-btn" onclick="loadOrders()">تحديث</button>
</header>

<div class="orders-list" id="ordersList">
  <div class="empty">جاري التحميل...</div>
</div>

<script>
  const statusLabels = {pending:"قيد الانتظار", confirmed:"مؤكد", cancelled:"ملغي"};

  async function loadOrders(){
    const res = await fetch("/api/orders");
    const data = await res.json();
    const orders = data.orders || [];

    document.getElementById("totalCount").textContent = orders.length;
    document.getElementById("pendingCount").textContent = orders.filter(o=>o.status==="pending").length;
    document.getElementById("confirmedCount").textContent = orders.filter(o=>o.status==="confirmed").length;

    const list = document.getElementById("ordersList");
    if(!orders.length){ list.innerHTML='<div class="empty">لا توجد طلبات بعد</div>'; return; }

    list.innerHTML = orders.map(o=>`
      <div class="order-card">
        <div class="order-top">
          <span class="order-id">#${o.id} — ${new Date(o.created_at).toLocaleString("ar-EG")}</span>
          <span class="badge ${o.status}">${statusLabels[o.status]||o.status}</span>
        </div>
        <div class="order-info">
          <div class="item"><div class="lbl">الاسم</div><div class="val">${o.name}</div></div>
          <div class="item"><div class="lbl">الهاتف</div><div class="val">${o.phone}</div></div>
          <div class="item"><div class="lbl">البريد</div><div class="val">${o.email}</div></div>
          <div class="item"><div class="lbl">الولاية</div><div class="val">${o.wilaya}</div></div>
          <div class="item"><div class="lbl">العنوان</div><div class="val">${o.address}</div></div>
          <div class="item"><div class="lbl">لون الساعة</div><div class="val">${o.watch_color||"—"}</div></div>
        </div>
        <div class="order-actions">
          <button class="btn-confirm" onclick="updateStatus(${o.id},'confirmed')">تأكيد</button>
          <button class="btn-cancel" onclick="updateStatus(${o.id},'cancelled')">إلغاء</button>
          <button class="btn-delete" onclick="deleteOrder(${o.id})">حذف</button>
        </div>
      </div>
    `).join("");
  }

  async function updateStatus(id, status){
    await fetch("/api/orders/"+id, {method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify({status})});
    loadOrders();
  }

  async function deleteOrder(id){
    if(!confirm("هل تريد حذف هذا الطلب؟")) return;
    await fetch("/api/orders/"+id, {method:"DELETE"});
    loadOrders();
  }

  loadOrders();
  setInterval(loadOrders, 15000);
</script>
</body>
</html>
